name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16  # same image as docker-compose.yml
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aria -d aria_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: aria
      POSTGRES_USER: aria
      POSTGRES_DB: aria_test
      # Enables the PostgreSQL + pgvector integration tests (skipped when unset)
      TEST_DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install OCR tools (Tesseract, poppler) used by document extraction tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      # pandas: the tests run the sandbox server in-process, and table analysis executes pandas code there
      - run: pip install -r requirements.txt pandas
      - name: Load database schema
        run: bash ../db/init/01-schema.sh
      - run: python -m pytest -q -rs

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # matches frontend/Dockerfile
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build (plain HTTP blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Some networks refuse outgoing connections on port 80. Reproduce that so every image must build over HTTPS.
      - name: Block outgoing plain HTTP (port 80)
        run: |
          sudo iptables -I OUTPUT -p tcp --dport 80 -j REJECT
          sudo iptables -I FORWARD -p tcp --dport 80 -j REJECT
          sudo iptables -L DOCKER-USER >/dev/null 2>&1 && sudo iptables -I DOCKER-USER -p tcp --dport 80 -j REJECT || true
          if curl -s -m 10 -o /dev/null http://deb.debian.org/; then echo "port 80 is still open"; exit 1; fi
          docker run --rm alpine sh -c 'wget -q -T 10 -O /dev/null http://deb.debian.org/ && exit 1 || exit 0'
      - name: Build backend, sandbox and frontend images
        run: |
          cp .env.example .env
          docker compose build
